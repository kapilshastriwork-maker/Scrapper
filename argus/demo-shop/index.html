<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Argus Phone X1</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        background: #f3f4f6;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        padding: 48px 40px;
        max-width: 420px;
        width: 90%;
        text-align: center;
      }

      .product-title {
        font-size: 28px;
        font-weight: 700;
        color: #111827;
        margin-bottom: 12px;
      }

      .price-container {
        margin-bottom: 16px;
      }

      .pricing-value {
        font-size: 32px;
        font-weight: 600;
        color: #1f2937;
      }

      [data-stock='true'] {
        display: inline-block;
        background: #dcfce7;
        color: #166534;
        font-weight: 600;
        font-size: 14px;
        padding: 6px 14px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 class="product-title">Argus Phone X1</h1>
      <div class="price-container">
        <div class="pricing-value">₹24,999</div>
      </div>
      <p data-stock="true">In Stock</p>
    </div>
  </body>
</html>
