<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Argus Phone X1 — Online Marketplace</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #eaeaea;
    color: #0f1111;
  }
  .page { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }
  .breadcrumb {
    font-size: 12px;
    color: #007185;
    margin-bottom: 18px;
  }
  .breadcrumb a { color: #007185; text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; color: #c7511f; }
  .product-card { background: #ffffff; padding: 24px 28px; border-radius: 8px; }
  .product-title {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 10px;
  }
  .ratings { margin-bottom: 18px; }
  .stars { color: #ffa41c; font-size: 16px; letter-spacing: 1px; }
  .rating-count { color: #007185; font-size: 13px; margin-left: 8px; }
  .price-block { border-top: 1px solid #e7e7e7; padding-top: 18px; }
  .price-label { font-size: 14px; color: #565959; }
  .price-section { margin-top: 6px; }
  .a-price { display: inline-flex; align-items: flex-start; }
  .price-symbol { font-size: 16px; font-weight: 500; margin-top: 3px; }
  .a-price-whole { font-size: 32px; font-weight: 600; }
  .mrp { display: block; font-size: 14px; color: #565959; margin-top: 6px; }
  .mrp-value { text-decoration: line-through; }
  .discount-badge {
    display: inline-block;
    margin-top: 8px;
    background: #ffeee8;
    color: #b12704;
    font-size: 13px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .stock-availability {
    margin-top: 14px;
    font-size: 15px;
    font-weight: 600;
    color: #067d62;
  }
</style>
</head>
<body>
  <div class="page">
    <nav class="breadcrumb">
      <a href="#">Electronics</a> &rsaquo; <a href="#">Mobile Phones</a> &rsaquo; <a href="#">Smartphones</a> &rsaquo; <a href="#">Argus</a>
    </nav>
    <div class="product-card">
      <h1 class="product-title">Argus Phone X1 (128GB, Midnight) — 6.7&Prime; AMOLED Display, 50MP Triple Camera</h1>
      <div class="ratings">
        <span class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
        <span class="rating-count">2,314 ratings</span>
      </div>
      <div class="price-block">
        <span class="price-label">Price:</span>
        <div class="price-section">
          <div class="a-price">
            <span class="price-symbol">&#8377;</span>
            <span class="a-price-whole">24,999</span>
          </div>
        </div>
        <span class="mrp">M.R.P.: <span class="mrp-value">&#8377;29,999</span></span>
        <span class="discount-badge">17% off</span>
      </div>
      <p class="stock-availability">In Stock</p>
    </div>
  </div>
</body>
</html>
