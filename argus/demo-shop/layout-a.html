<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Argus Phone X1 — Modern Store</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #f6f7fb;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #111827;
  }
  .page { width: 100%; max-width: 480px; padding: 24px; }
  .card {
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(30, 41, 59, 0.12);
    overflow: hidden;
  }
  .hero {
    height: 260px;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero .phone {
    width: 96px;
    height: 180px;
    border-radius: 18px;
    background: linear-gradient(160deg, #e0e7ff, #312e81);
    box-shadow: 0 16px 32px rgba(0, 0, 0, 0.35);
  }
  .body { padding: 28px 28px 32px; }
  .product-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
  }
  .price {
    display: block;
    font-size: 34px;
    font-weight: 800;
    color: #0f172a;
    margin-bottom: 14px;
  }
  .availability {
    display: inline-block;
    background: #d1fae5;
    color: #065f46;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 24px;
  }
  .add-to-cart {
    width: 100%;
    border: none;
    border-radius: 14px;
    background: #4f46e5;
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    padding: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="hero"><div class="phone"></div></div>
      <div class="body">
        <h1 class="product-title">Argus Phone X1</h1>
        <span class="price">₹24,999</span>
        <span class="availability">In Stock</span>
        <button class="add-to-cart" type="button">Add to Cart</button>
      </div>
    </div>
  </div>
</body>
</html>
