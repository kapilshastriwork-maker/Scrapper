<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Argus Phone X1 — Brand</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #faf7f2;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    border-bottom: 1px solid #e4ddd2;
    font-family: system-ui, sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #6b6355;
    padding: 14px 40px;
  }
  .page {
    flex: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 80px 40px 60px;
  }
  .product-name {
    font-size: 44px;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.15;
    margin-bottom: 16px;
  }
  .tagline {
    font-family: system-ui, sans-serif;
    font-size: 14px;
    color: #6b6355;
    margin-bottom: 40px;
  }
  .price {
    display: block;
    font-size: 30px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .currency { font-size: 16px; font-weight: 400; color: #6b6355; }
  .fulfillment-note {
    font-family: system-ui, sans-serif;
    font-size: 14px;
    color: #2f6b3c;
    margin-bottom: 40px;
  }
  .cta {
    display: inline-block;
    font-family: system-ui, sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #faf7f2;
    background: #1a1a1a;
    padding: 14px 34px;
    border-radius: 999px;
  }
  .details {
    margin-top: 64px;
    padding-top: 28px;
    border-top: 1px solid #e4ddd2;
    font-family: system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.8;
    color: #6b6355;
  }
</style>
</head>
<body>
  <div class="topbar">Argus &mdash; Built to last</div>
  <div class="page">
    <h1 class="product-name">Argus Phone X1</h1>
    <p class="tagline">The everyday flagship, thoughtfully designed.</p>
    <span class="price">24,999 <span class="currency">INR</span></span>
    <p class="fulfillment-note">Ships within 2 business days &mdash; item in stock</p>
    <span class="cta">Pre-order</span>
    <div class="details">
      <p>6.7&Prime; AMOLED display &middot; 50MP triple camera &middot; 128GB storage</p>
      <p>Free shipping over &#8377;5,000 &middot; 1-year warranty included</p>
    </div>
  </div>
</body>
</html>
